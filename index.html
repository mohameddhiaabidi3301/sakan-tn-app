.h2{font-size:24px;margin:6px 0 12px}

/* ===== Cartes d'annonces v2 ===== */
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.lc{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;box-shadow:0 1px 2px #0a12301c,0 8px 24px #0a123010}
.lc:hover{transform:translateY(-4px);box-shadow:0 14px 34px #0a123030}
.lc-img{position:relative;aspect-ratio:16/11;background:linear-gradient(135deg,hsl(var(--h) 55% 36%),hsl(calc(var(--h) + 35) 65% 52%));overflow:hidden;cursor:pointer}
.lc-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.lc:hover .lc-img img{transform:scale(1.06)}
.lc-img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0,transparent 35%,transparent 60%,rgba(0,0,0,.55) 100%);pointer-events:none}
.lc-ver,.lc-q,.hrt{position:absolute;z-index:2}
.lc-ver{top:12px;left:12px;background:rgba(255,255,255,.95);color:#18794E;font:700 12px "Inter";padding:5px 10px;border-radius:999px;display:flex;gap:5px;align-items:center}
.lc-ver.no{color:#8A5A00}
.lc-q{left:14px;bottom:12px;color:#fff;font:700 15px "Inter";text-shadow:0 1px 4px #0006}
.lc-q small{display:block;font:500 12px "Inter";opacity:.92}
.hrt{top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#12224A;font-size:19px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px #0003;transition:transform .15s}
.hrt:hover{transform:scale(1.12)}.hrt[aria-pressed=true]{background:#DC1F23;color:#fff}
.lc-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}

.lc-b h3{font-size:18px;margin:0;line-height:1.25}
.lc-p{display:flex;align-items:baseline;gap:6px;margin-top:2px}.lc-p b{font:800 26px "Inter";color:var(--ink)}.lc-p span{color:var(--mut);font-size:13px}
.lc-tot{font-size:13px;color:var(--mut)}.lc-tot b{color:var(--ink)}
.lc-m{display:flex;gap:14px;font-size:13px;color:var(--mut);padding:10px 0;margin:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lc-t{display:flex;flex-wrap:wrap;gap:2px}.lc-t .tag{margin:2px 4px 2px 0}

.lc-a .btn.g[aria-pressed=true]{background:var(--blue);color:#fff}

/* ===== Thème professionnel ===== */
:root{--bg:#F6F7F9;--card:#fff;--ink:#18212F;--mut:#5B6676;--line:#E2E6EC;--blue:#1E4E8C;--sky:#2F6FB5;--soft:#EEF2F7;--red:#B42318;--ok:#16794C;--okbg:#E7F4EC;--warn:#8A5A00;--warnbg:#FFF4DB}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E131B;--card:#151C27;--ink:#E8ECF2;--mut:#9CA7B8;--line:#243042;--blue:#7FB0F0;--sky:#6AA2E8;--soft:#1B2432;--red:#E5736B;--ok:#6FD1A0;--okbg:#12301F;--warn:#F0C674;--warnbg:#33290F}:root:not([data-theme=light]) header{background:#151C27}}
:root[data-theme=dark]{--bg:#0E131B;--card:#151C27;--ink:#E8ECF2;--mut:#9CA7B8;--line:#243042;--blue:#7FB0F0;--sky:#6AA2E8;--soft:#1B2432;--red:#E5736B;--ok:#6FD1A0;--okbg:#12301F;--warn:#F0C674;--warnbg:#33290F}
:root[data-theme=dark] header{background:#151C27}
body{font:400 15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Inter",system-ui,sans-serif;font-weight:600;letter-spacing:-.015em}
.h2{font-size:22px;font-weight:600;margin:20px 0 14px}
.hero2 h1{font-weight:600;letter-spacing:-.025em}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
/* logo */
.logo{font:700 18px "Inter";letter-spacing:-.02em;gap:10px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue)}
.logo i:after{left:6px;top:6px;width:16px;height:16px;border-radius:0;background:#fff;clip-path:polygon(50% 0,100% 46%,86% 46%,86% 100%,14% 100%,14% 46%,0 46%)}
header{box-shadow:0 1px 0 var(--line);border-bottom:0}
/* cartes */
.card{border-radius:12px;box-shadow:none;border:1px solid var(--line)}
.hb:hover{transform:none;border-color:var(--blue);box-shadow:0 2px 10px #0a12301a}
.hb h3{font-size:16px;margin-bottom:2px}
.lc{box-shadow:0 1px 2px #0a123012;transition:box-shadow .2s,border-color .2s}
.lc:hover{transform:none;box-shadow:0 8px 24px #0a123019;border-color:#cdd5e0}
.lc-img{background:linear-gradient(135deg,hsl(var(--h) 18% 40%),hsl(var(--h) 22% 55%))}
.lc:hover .lc-img img{transform:scale(1.03)}
.lc-img:after{background:linear-gradient(180deg,rgba(10,15,25,.18) 0,transparent 30%,transparent 62%,rgba(10,15,25,.6) 100%)}
.lc-ver{font:600 12px "Inter";background:#fff;color:var(--ok);padding:5px 10px 5px 8px;border-radius:6px;box-shadow:0 1px 3px #0003}
.lc-ver.no{color:#6B5B2E;padding-left:10px}
.lc-ver .ic{width:14px;height:14px;stroke-width:2.4}
.lc-q{font:600 15px "Inter";text-shadow:0 1px 3px #0007}.lc-q small{font:400 12px "Inter"}
.hrt{width:36px;height:36px;border-radius:50%;background:#fff;color:#334155;box-shadow:0 1px 4px #0003}
.hrt:hover{transform:none;background:#f1f4f8}.hrt .ic{width:18px;height:18px}
.hrt[aria-pressed=true]{background:#fff;color:#C8372D}
.lc-b{padding:16px 18px 18px;gap:4px}
.lc-ty{font:600 11px "Inter";letter-spacing:.08em;color:var(--mut)}
.lc-b h3{font-size:17px;font-weight:600}
.lc-p b{font:700 24px "Inter";letter-spacing:-.02em}.lc-p span{font-size:13px}
.lc-m{gap:18px;border-color:var(--line);padding:11px 0}.lc-m span{display:flex;align-items:center;gap:6px}
.lc-m .ic{color:var(--mut)}
/* tags */
.tag{font:500 12px "Inter";border-radius:6px;padding:3px 8px;background:var(--soft);color:var(--mut)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.ok .ic{width:13px;height:13px;stroke-width:2.4;vertical-align:-2px}
.tag.no{background:var(--warnbg);color:var(--warn)}
/* boutons */
.btn{border-radius:8px;font-weight:600;font-size:14px;padding:9px 16px;transition:background .15s,border-color .15s}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{background:var(--soft);filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[aria-pressed=true]{background:var(--soft);color:var(--blue);border:1px solid var(--blue)}
.btn.r{background:var(--red);color:#fff;border:0}
.lc-a .btn{padding:10px 14px}.lc-a .btn.g[aria-pressed=true]{background:var(--soft);color:var(--blue);border-color:var(--blue)}
.btn .ic{margin-right:4px}
/* champs */
input[type=number],input[type=text],input[type=password],input[type=email],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px}
input:focus,select:focus{border-color:var(--sky);outline:0;box-shadow:0 0 0 3px #2f6fb533}
label{font-weight:500;color:var(--ink)}
.chip{background:var(--card);border-radius:8px;padding:6px 12px;font-weight:500}
.chip[aria-pressed=true]{background:var(--soft);color:var(--blue);border-color:var(--blue)}
/* navigation */
nav#nav button{border-radius:8px;font-weight:500}
nav#nav button[aria-current=true]{background:var(--soft);color:var(--blue);font-weight:600}
nav#nav em,.seg em{background:var(--blue);color:#fff}
.seg{background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:22px;display:flex;margin:20px 0 4px}
.seg button{border-radius:0;padding:10px 2px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-selected=true]{background:transparent;box-shadow:none;color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tg{border-radius:8px}
/* divers */

{id:6,t:"Appartement S+1",q:"El Manar",ty:"Appartement",r:480,c:40,u:3,w:25,f:0,v:1,rm:1,ac:1,tr:5},

function mark(c){if(S.tr[S.tr.length-1]!==c){S.tr.push(c);S.tr=S.tr.slice(-6)}renderTrail()}

const tot=l=>l.r+l.c, byId=id=>L.find(l=>l.id==id);
const USERS=[{e:"amina@etu.tn",p:"demo1234",n:"Amina Ben Salah",r:"t"},{e:"hedi@proprio.tn",p:"demo1234",n:"Hédi Mansouri",r:"o"}];
const own=l=>l.ow||"hedi@proprio.tn",nameOf=e=>(USERS.find(u=>u.e===e)||{n:e}).n,isLo=l=>l.lo||S.st[l.id]==="Loué",mine=()=>S.visits.filter(v=>v.by===S.u.e);
function setTab(t){S.tab=t;renderNav();render();window.scrollTo({top:0,behavior:'smooth'})}
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',explore:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',sel:'<path d="M12 20s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>',msgs:'<path d="M4 5h16v11H9l-5 4z"/>',pay:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="15" cy="12" r="1"/>',odash:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',ovisits:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',orents:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>'};
const GT=[["home","Accueil",["home"]],["explore","Explorer",["search","map","quarters","plan"]],["sel","Ma sélection",["favs","compare","visits"]],["msgs","Messages",["msgs"]],["pay","Mon espace",["pay"]]];
const GO=[["odash","Tableau de bord",["odash"]],["ovisits","Visites",["ovisits"]],["msgs","Messages",["msgs"]],["orents","Loyers",["orents"]]];
const SUB={search:"Liste",map:"Carte",quarters:"Quartiers",plan:"Budget",favs:"Favoris",compare:"Comparer",visits:"Visites"};
const HUE={"Ariana":215,"El Manar":160,"Centre-ville":265,"La Marsa":190,"Bardo":20,"Lac":300};
function renderNav(){if(!S.u){$('#nav').innerHTML='';$('#sub').innerHTML='';return}
 const o=S.u.r==='o',me=S.u.e,G=o?GO:GT,c=o?{ovisits:S.visits.filter(v=>!v.ok&&own(byId(v.id))===me).length}:{favs:S.fav.length,compare:S.cmp.length,visits:mine().length,msgs:Object.keys(S.msgs).filter(k=>k.split('|')[1]===me).length};
 const cur=G.find(g=>g[2].includes(S.tab))||G[0];
 $('#nav').innerHTML=G.map(([k,n,sb])=>`<button data-a="tab" data-v="${sb.includes(S.tab)?S.tab:sb[0]}" aria-current="${cur[0]===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg><span>${n}</span>${c[k]?`<em>${c[k]}</em>`:''}</button>`).join('');
 $('#sub').innerHTML=cur[2].length>1?`<div class="seg" role="tablist">${cur[2].map(k=>`<button role="tab" data-a="tab" data-v="${k}" aria-selected="${S.tab===k}">${SUB[k]}${c[k]?`<em>${c[k]}</em>`:''}</button>`).join('')}</div>`:''}
function filtered(){const f=S.fl;let r=L.filter(l=>S.st[l.id]!=='En validation'&&l.r<=f.bud&&(!f.q||l.q===f.q)&&(!f.ty||l.ty===f.ty)&&(!f.ver||l.v)&&(!f.fur||l.f)&&(!f.rem||l.rm)&&(!f.acc||l.ac)&&l.w<=f.wmax);
 return r.sort((a,b)=>f.sort==="uni"?a.u-b.u:f.sort==="work"?a.w-b.w:f.sort==="total"?tot(a)-tot(b):a.r-b.r)}
const IMGK={Studio:"apartment,interior",Colocation:"bedroom,interior",Appartement:"apartment,livingroom"};
const IX={check:'<path d="M20 6 9 17l-5-5"/>',heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',cap:'<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',brief:'<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.940 1.940 0 0 0 3.4 0"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',arrow:'<path d="m12 19-7-7 7-7M19 12H5"/>'};
const ic=(n,f)=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"${f?' style="fill:currentColor"':''}>${IX[n]}</svg>`;
const WM=f=>`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(f)}?width=640`;
const PH={Colocation:["Detweiler House Interior - Bedroom.jpg","Hotel-suite-living-room.jpg"],Studio:["Hotel-suite-living-room.jpg","Hester Diamond Living Room 2 by Rachel Kaminsky.9.2020 03.jpg","Detweiler House Interior - Bedroom.jpg"],Appartement:["Detweiler House Interior - Living Room.jpg","Hester Diamond Living Room 2 by Rachel Kaminsky.9.2020 03.jpg","Hotel-suite-living-room.jpg"]};
function roomSVG(l){const h=HUE[l.q]||215,bed=l.ty==="Colocation",f=bed?`<rect x="60" y="250" width="250" height="95" rx="12" fill="hsl(${h+30} 45% 42%)"/><rect x="60" y="225" width="250" height="40" rx="12" fill="hsl(${h+30} 40% 32%)"/><rect x="80" y="238" width="80" height="30" rx="10" fill="#fff" opacity=".9"/><rect x="175" y="238" width="80" height="30" rx="10" fill="#fff" opacity=".9"/>`:`<rect x="50" y="240" width="270" height="100" rx="16" fill="hsl(${h+30} 45% 42%)"/><rect x="50" y="215" width="270" height="50" rx="16" fill="hsl(${h+30} 40% 34%)"/><rect x="85" y="245" width="95" height="40" rx="10" fill="#fff" opacity=".18"/><rect x="190" y="245" width="95" height="40" rx="10" fill="#fff" opacity=".18"/>`;
 const x=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"><rect width="640" height="440" fill="hsl(${h} 35% 84%)"/><rect y="330" width="640" height="110" fill="hsl(${h} 25% 62%)"/><rect x="390" y="70" width="190" height="160" rx="6" fill="#d8ecff" stroke="#fff" stroke-width="10"/><path d="M485 70V230M390 150H580" stroke="#fff" stroke-width="8"/>${f}<path d="M500 345V270" stroke="#555" stroke-width="5"/><path d="M470 270h60l-12-45h-36z" fill="#ffd98a"/><rect x="455" y="338" width="90" height="10" rx="4" fill="#555"/></svg>`;return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x)}
const imgList=l=>{const p=PH[l.ty]||PH.Studio;return [WM(p[l.id%p.length]),`https://loremflickr.com/640/440/${l.id===8?"apartment,sea":"apartment,interior"}?lock=${l.id*7+3}`,roomSVG(l)]};

 return `<article class="card lc"><div class="lc-img" style="--h:${HUE[l.q]||215}" data-a="detail" data-v="${l.id}"><img src="${imgList(l)[0]}" data-i="${l.id}" data-n="0" onerror="imgErr(this)" alt="${l.t} à ${l.q}" loading="lazy">

 <button class="hrt" data-a="fav" data-v="${l.id}" aria-pressed="${fv}" aria-label="${fv?'Retirer des favoris':'Ajouter aux favoris'}">${ic('heart',fv)}</button>
 <div class="lc-q">${l.q}<small>${l.tr} min à pied d’un transport</small></div></div>
 <div class="lc-b"><div class="lc-ty">${l.ty}</div><h3>${l.t}</h3>

function V_search(){const f=S.fl,chip=(k,n)=>`<button class="chip" data-a="chip" data-v="${k}" aria-pressed="${!!f[k]}">${n}</button>`;
 return `<div class="lay"><aside class="card side"><h3>Filtres</h3>

 <label>Trajet max vers le travail : <output id="o2">${f.wmax} min</output><input type="range" min="5" max="60" step="5" value="${f.wmax}" data-f="wmax"></label>

 <label>Trier par<select data-f="sort">${[["price","Loyer"],["total","Coût total"],["uni","Distance université"],["work","Trajet travail"]].map(([k,n])=>`<option value="${k}" ${f.sort===k?'selected':''}>${n}</option>`).join('')}</select></label>

function V_compare(){const c=S.cmp.map(byId);if(c.length<2)return `<div class="card empty">Choisissez 2 ou 3 logements avec « Comparer » dans la recherche.<br><br><button class="btn" data-a="tab" data-v="search">Aller à la recherche</button></div>`;
 const min=(fn)=>Math.min(...c.map(fn)),row=(n,fn,best)=>`<tr><th>${n}</th>${c.map(l=>`<td class="${best!==undefined&&fn(l)===best?'best':''}">${typeof fn(l)==='number'&&n.includes('TND')?fn(l)+' TND':fn(l)}</td>`).join('')}</tr>`;
 return `<h2 class="h2">Comparaison côte à côte</h2><div class="card ov"><table><tr><th></th>${c.map(l=>`<th>${l.t}<br><span class="mut">${l.q}</span></th>`).join('')}</tr>
 ${row('Loyer (TND)',l=>l.r,min(l=>l.r))}${row('Charges (TND)',l=>l.c,min(l=>l.c))}${row('Coût mensuel total (TND)',tot,min(tot))}${row('Caution 2 mois (TND)',l=>l.r*2,min(l=>l.r))}${row('Coût d’entrée (TND)',l=>tot(l)+l.r*2,min(l=>tot(l)+l.r*2))}
 ${row('Distance université',l=>l.u+' km',undefined)}${row('Trajet vers le travail',l=>l.w+' min',undefined)}${row('Annonce',l=>l.v?'Vérifiée':'Non vérifiée')}
 <tr><th></th>${c.map(l=>`<td><button class="btn sm" data-a="detail" data-v="${l.id}">Détails</button> <button class="btn g sm" data-a="cmp" data-v="${l.id}">Retirer</button></td>`).join('')}</tr></table></div><p class="mut">Les cases vertes marquent la meilleure valeur.</p><button class="btn" data-a="cmpbud">Estimer mon budget avec le moins cher</button>`}

 <div class="card"><div class="row" style="justify-content:space-between"><span>Loyer</span><b>${tnd(l.r)}</b></div><div class="row" style="justify-content:space-between"><span>Charges</span><b>${tnd(l.c)}</b></div><div class="row" style="justify-content:space-between"><span>Total mensuel</span><b>${tnd(tot(l))}</b></div><div class="row" style="justify-content:space-between"><span>Caution (2 mois)</span><b>${tnd(l.r*2)}</b></div><div class="row" style="justify-content:space-between"><span>À payer à l’entrée</span><b>${tnd(tot(l)+l.r*2)}</b></div></div>
 <p class="mut">Bail 12 mois · préavis 1 mois · ${l.u} km de l’université · ${l.w} min du travail · ${l.tr} min à pied d’un transport.</p>
 ${b?`<p class="tag ${b.ok?'ok':'no'}" style="width:max-content">Visite : ${b.slot} (${b.ok?'confirmée':'en attente'})</p>`:`<label>Créneau de visite<select id="slot">${SLOTS.map(s=>`<option>${s}</option>`).join('')}</select></label>${l.rm?`<label class="ck"><input type="checkbox" id="vr"><span>Visite à distance en visio</span></label>`:''}`}
 <div class="row">${b?'':`<button class="btn" data-a="book" data-v="${id}">Réserver la visite</button>`}<button class="btn g" data-a="msg" data-v="${id}">Écrire au propriétaire</button><button class="btn g" data-a="fav" data-v="${id}" aria-pressed="${S.fav.includes(id)}">${S.fav.includes(id)?' Favori':' Favori'}</button><button class="btn r" data-a="sign" data-v="${id}">Signer le bail</button></div>`)}
const act={
theme(){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'},
tab:setTab,close(){$('#dlg').close()},
chip(k){S.fl[k]=S.fl[k]?0:1;render()},
reset(){S.fl={...DEF};render()},
fav(id){id=+id;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];toast(S.fav.includes(id)?'Ajouté aux favoris':'Retiré des favoris');$('#dlg').open?detail(id):render()},
cmp(id){id=+id;if(S.cmp.includes(id))S.cmp=S.cmp.filter(x=>x!==id);else if(S.cmp.length>=3)return toast('Maximum 3 logements à comparer');else{S.cmp.push(id);toast('Ajouté au comparateur ('+S.cmp.length+'/3)')}render()},
detail(id){detail(+id)},
book(id){id=+id;const slot=$('#slot').value,rem=$('#vr')?$('#vr').checked:false;if(S.visits.some(v=>v.slot===slot))return toast('Ce créneau est déjà pris par une autre visite');
 S.visits.push({id,slot,rem,ok:false,by:S.u.e});toast('Demande envoyée au propriétaire');detail(id);render();mark('L10');mark(rem?'L14':'L13');},
unbook(id){S.visits=S.visits.filter(v=>!(v.id==id&&v.by===S.u.e));toast('Visite annulée');render()},
qfilter(q){S.fl={...S.fl,q};S.tab='search';render();window.scrollTo({top:0,behavior:'smooth'})},
usebud(){S.fl.bud=Math.max(300,S.est.r);S.tab='search';render();toast('Budget appliqué : '+S.est.r+' TND')},
alert(){S.al.push({q:$('#aq').value,b:+$('#ab').value||500});toast('Alerte activée');render();mark('L12')},
delal(i){S.al.splice(+i,1);render()},
simal(){const a=S.al[0],m=L.filter(l=>l.q===a.q&&l.r<=a.b)[0];toast(m?'Nouvelle annonce : '+m.t+', '+m.q+', '+m.r+' TND':'Pas de nouvelle annonce pour '+a.q+' ≤ '+a.b+' TND')},
msg(id){const k=id+'|'+S.u.e;S.msgs[k]=S.msgs[k]||[{t:"Bonjour, le logement est-il toujours disponible ?",by:'t'}];$('#dlg').close();setTab('msgs')},
send(k){const i=document.querySelector(`[data-ki="${k}"]`),t=i.value.trim();if(!t)return;S.msgs[k].push({t,by:S.u.r});render()},
sign(id){id=+id;if(!mine().some(v=>v.id===id&&v.ok))return toast('Réservez et faites confirmer une visite avant de signer');const l=byId(id);S.lease={id,by:S.u.e};S.pays=[];S.st[id]='Loué';S.ten.v='R1';$('#dlg').close();toast('Bail signé : '+l.t);setTab('pay')},
amode(){S.am=S.am==='in'?'up':'in';const up=S.am==='up';$('#an').hidden=!up;$('#ar').hidden=!up;$('#at').textContent=up?'Créer un compte':'Connexion';$('#abtn').textContent=up?'Créer mon compte':'Se connecter';$('#amb').textContent=up?'J’ai déjà un compte':'Créer un compte';$('#aerr').textContent=''},
demo(r){const u=USERS.find(x=>x.r===r);$('#aemail').value=u.e;$('#apw').value=u.p;$('#aerr').textContent=''},
login(){const e=$('#aemail').value.trim().toLowerCase(),p=$('#apw').value,er=m=>{$('#aerr').textContent=m};
 if(S.am==='up'){const n=$('#aname').value.trim();if(!n||!e.includes('@')||p.length<6)return er('Indiquez votre nom, un email valide et un mot de passe de 6 caractères minimum.');if(USERS.some(x=>x.e===e))return er('Cet email a déjà un compte.');USERS.push({e,p,n,r:$('#arole').value})}
 const u=USERS.find(x=>x.e===e&&x.p===p);if(!u)return er('Email ou mot de passe incorrect.');enter(u)},
logout(){if($('#dlg').open)$('#dlg').close();S.u=null;S.tr=[];S.lastTab=null;renderAuth();toast('Vous êtes déconnecté')},
qs(){S.fl={...DEF,q:$('#hq').value,bud:+$('#hb').value};setTab('search')},
trail(){S.trailOn=!S.trailOn;$('#tr').setAttribute('aria-pressed',!!S.trailOn);renderTrail()},
mq(q){S.mq=q;render()},
toalerts(){const l=byId(S.fav[0]);setTab('plan');mark('L12');$('#aq').value=l.q;$('#ab').value=Math.ceil(l.r/50)*50+50},
cmpbud(){const c=S.cmp.map(byId).sort((a,b)=>tot(a)-tot(b))[0];S.est.r=c.r;S.est.c=c.c;setTab('plan')},
tv(v){S.ten.v=v;render()},
topay(k){S.ten.k=k;S.ten.fail=0;S.ten.v='R6';render()},
meth(m){S.ten.meth=m;render()},
rtog(){S.ten.rem=S.ten.rem?0:1;render();if(S.ten.rem)mark('R13')},
ftog(){S.ten.fail=S.ten.fail?0:1;render()},
confirm(){const T=S.ten,l=byId(S.lease.id);if(T.fail){T.fail=0;T.v='E2';return render()}const a=T.k==='Caution'?l.r*2:tot(l);S.pays.push({k:T.k,a,m:T.meth+(T.rem?' (à distance)':'')});T.v='R8';toast('Paiement validé · notification envoyée');render()},
rem(){S.rem=S.rem?0:1;toast(S.rem?'Rappel activé':'Rappel désactivé');mark('R9')},
receipt(i){const p=S.pays[i],l=byId(S.lease.id);openD(`<h2>Quittance</h2><div class="card"><b>${l.t} · ${l.q}</b><br>Objet : ${p.k}<br>Montant reçu : <b>${tnd(p.a)}</b><br>Moyen : ${p.m}<br>Statut : payé, reçu par le propriétaire</div><div class="row"><button class="btn" onclick="window.print()">Imprimer</button></div>`)},
ost(id){const o=["Libre","En visite","Loué","En validation"],c=S.st[id]||'Libre';S.st[id]=o[(o.indexOf(c)+1)%4];render()},
vok(v){const[e,id]=v.split('|');S.visits.find(a=>a.by===e&&a.id==id).ok=true;toast('Visite confirmée');render()},
vno(v){const[e,id]=v.split('|');S.visits=S.visits.filter(a=>!(a.by===e&&a.id==id));toast('Demande refusée');render()},
newl(){const t=$('#nt').value.trim(),r=+$('#nr').value;if(!t||!r)return toast('Renseignez un titre et un loyer');const id=Date.now();L.push({id,t,q:$('#nq').value,ty:'Studio',r,c:50,u:2,w:30,f:0,v:0,rm:0,ac:0,tr:8,ow:S.u.e});S.st[id]='En validation';toast('Annonce envoyée pour validation');render()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;act[b.dataset.a]&&act[b.dataset.a](b.dataset.v)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a==='rem')act.rem();if(t.dataset.c){S.chk[t.dataset.c]=t.checked;render()}else if(t.dataset.f&&t.tagName==='SELECT'){S.fl[t.dataset.f]=t.value;updRes()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&t.type==='range'){S.fl[t.dataset.f]=+t.value;t.previousSibling;t.closest('label').querySelector('output').textContent=t.value+(t.dataset.f==='bud'?' TND':' min');updRes()}
 if(t.dataset.e){S.est[t.dataset.e]=+t.value;t.closest('label').querySelector('output').textContent=t.value+' TND';const e=S.est,T=e.r+e.c+e.t+e.e||1;$('#tot').innerHTML=T+' <small>TND / mois</small>';[...document.querySelectorAll('#bar span')].forEach((sp,i)=>sp.style.width=[e.r,e.c,e.t,e.e][i]/T*100+'%')}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.dataset.enter)act.send(e.target.dataset.enter);if(['apw','aemail','aname'].includes(e.target.id))act.login()});
renderAuth();
</script>
</body>
</html>
